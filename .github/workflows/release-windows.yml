name: release-windows

# 上游那份 .github/workflows/release.yml 搬到仓库根，改两处：tag 前缀从 v 改成
# windows-v（一个 tag 只出一个变体），所有 run 步骤挂到 windows/ 下（jev.spec 里
# main.py、docs/icon.ico 都是相对路径，必须在那棵树里跑 PyInstaller）。其余照旧。
on:
  push:
    tags: ['windows-v*']
  workflow_dispatch:        # 手动触发只出 artifact，方便试打包

permissions:
  contents: write           # 建 Release 要写权限

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: windows-latest  # 只能在 Windows 上打，PyInstaller 不能交叉编译
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: 写入版本号（tag 用 tag 名，手动触发用短 SHA）
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^windows-v','' } else { $env:GITHUB_SHA.Substring(0, 7) }
          Set-Content -Path app/version.py -Value ('VERSION = "' + $ver + '"') -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: windows/requirements.txt

      - name: 装依赖
        run: pip install -r requirements.txt pyinstaller

      - name: 打包
        run: pyinstaller --noconfirm --clean jev.spec

      - name: 压 zip（tag 用 tag 名，手动触发用短 SHA）
        id: pack
        shell: pwsh
        run: |
          $exe = 'dist\jev-chat-windows\jev-chat-windows.exe'
          if (-not (Test-Path $exe)) { throw "exe 没生成：$exe" }
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { 'v' + ($env:GITHUB_REF_NAME -replace '^windows-v','') } else { $env:GITHUB_SHA.Substring(0, 7) }
          $zip = "jev-chat-windows-$ver.zip"
          Copy-Item -Path LICENSE, NOTICE -Destination 'dist\jev-chat-windows'
          Compress-Archive -Path 'dist\jev-chat-windows' -DestinationPath $zip
          # 输出给后面两步用：相对仓库根，upload-artifact / gh-release 都从那里看路径
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip=windows/$zip"
          "{0}  {1:N1} MB" -f $zip, ((Get-Item $zip).Length / 1MB)

      - name: 上传构建产物
        if: always()  # 失败时也把已经有的东西捞上来
        uses: actions/upload-artifact@v4
        with:
          name: jev-chat-windows
          path: 'windows/*.zip'
          if-no-files-found: warn

      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.zip }}
          generate_release_notes: true
